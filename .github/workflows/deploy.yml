name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Inject EmailJS config
        run: |
          cat > config.js << EOF
          // Auto-generated by GitHub Actions — do not edit or commit this file
          window.EMAILJS_PUBLIC_KEY  = '${{ secrets.EMAILJS_PUBLIC_KEY }}';
          window.EMAILJS_SERVICE_ID  = '${{ secrets.EMAILJS_SERVICE_ID }}';
          window.EMAILJS_TEMPLATE_ID = '${{ secrets.EMAILJS_TEMPLATE_ID }}';
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js
          git diff --cached --quiet || git commit -m "chore: inject emailjs config"
          git push
